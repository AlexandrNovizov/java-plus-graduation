syntax = "proto3";

package stats.service.collector;

option java_multiple_files = true;
option java_package = "ru.practicum.grpc";

import "stat/messages/UserActionProto.proto";

import "google/protobuf/empty.proto";

service UserActionController {
  rpc CollectUserAction (stat.proto.UserActionProto) returns (google.protobuf.Empty);
}