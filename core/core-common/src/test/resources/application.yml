spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            user-service:
              - uri: http://localhost:80
            category-service:
              - uri: http://localhost:80
            request-service:
              - uri: http://localhost:80
            event-service:
              - uri: http://localhost:80
    loadbalancer:
      blocking:
        enabled: true
      reactor:
        enabled: true