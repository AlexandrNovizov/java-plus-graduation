spring:
  application:
    name: comment-service
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true
  config:
    import: 'configserver:'

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}