server:
  port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
      properties:
        hibernate:
          format_sql: true
#      open-in-view: false
  sql:
    init:
      mode: always

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:7542/ewm-main
    username: main
    password: main

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000

stats-service:
  id: stat-service