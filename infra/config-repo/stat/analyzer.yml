kafka:
  consumers:
    "[user.action]":
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.practicum.kafka.UserActionDeserializer
      group-id: analyzer-1
      enable-auto-commit: false
      poll-timeout: 100ms
    "[event.similarity]":
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.practicum.kafka.EventSimilarityDeserializer
      group-id: analyzer-1
      enable-auto-commit: false
      poll-timeout: 100ms
  topics:
    "[user.action]": '${USER_ACTION_TOPIC:stats.user-actions.v1}'
    "[event.similarity]": '${EVENT_SIMILARITY_TOPIC:stats.events-similarity.v1}'
  bootstrap-servers: "${KAFKA_SERVERS:localhost:9092}"

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:7542/ewm_recommendations}
    username: main
    password: main

grpc:
  server:
    port: 0