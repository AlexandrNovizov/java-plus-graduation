kafka:
  producer:
    "key.serializer": "org.apache.kafka.common.serialization.LongSerializer"
    "value.serializer": "ru.practicum.kafka.serialization.MessageSerializer"
  consumer:
    "key.deserializer": "org.apache.kafka.common.serialization.LongDeserializer"
    "value.deserializer": "ru.practicum.kafka.serialization.UserActionDeserializer"
    "group.id": 'aggregator-1'
    "enable.auto.commit": "false"
    "poll-timeout": "100ms"
  topics:
    "user.action": '${USER_ACTION_TOPIC:stats.user-actions.v1}'
    "event.similarity": '${EVENT_SIMILARITY_TOPIC:stats.events-similarity.v1}'
  bootstrapServers: "${KAFKA_SERVERS:localhost:9092}"

grpc:
  server:
    port: 0

server:
  port: 0