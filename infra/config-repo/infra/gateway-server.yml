server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, gatewayroutes

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: comments-read
          uri: lb://comment-service
          predicates:
            - Method=GET
            - Path=/comments/**,/users/{userId}/comments/**,/admin/comments/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: comments-change
          uri: lb://comment-service
          predicates:
            - Path=/comments/**,/users/{userId}/comments/**,/admin/comments/**

        - id: events-read
          uri: lb://event-service
          predicates:
            - Method=GET
            - Path=/admin/events/**,/users/{userId}/events/**,/events/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: events-change
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**,/users/{userId}/events/**,/events/**

        - id: requests-read
          uri: lb://request-service
          predicates:
            - Method=GET
            - Path=/users/{userId}/requests/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: requests-change
          uri: lb://request-service
          predicates:
            Path=/users/{userId}/requests/**

        - id: users-read
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: users-change
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: compilation-read
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: compilation-change
          uri: lb://compilation-service
          predicates:
            - Path=/admin/compilations/**

        - id: category-read
          uri: lb://category-service
          predicates:
            - Path=/categories/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: category-change
          uri: lb://category-service
          predicates:
            - Path=/admin/categories/**