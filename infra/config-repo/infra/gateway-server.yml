server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, gatewayroutes

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: events-read
          uri: lb://event-service
          predicates:
            - Method=GET
            - Path=/admin/events/**,/users/{userId}/events/**,/events/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: events-change
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**,/users/{userId}/events/**,/events/**

        - id: requests-read
          uri: lb://request-service
          predicates:
            - Method=GET
            - Path=/users/{userId}/requests/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: requests-change
          uri: lb://request-service
          predicates:
            Path=/users/{userId}/requests/**

        - id: users-read
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: users-change
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: admin-change
          uri: lb://main-service
          predicates:
            - Path=/admin/**

        - id: private-read
          uri: lb://main-service
          predicates:
            - Path=/users/{userId}/comments
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: private-change
          uri: lb://main-service
          predicates:
            - Path=/users/{userId}/**
        - id: public-read
          uri: lb://main-service
          predicates:
            - Path=/categories/**,/comments/**,/compilations/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms