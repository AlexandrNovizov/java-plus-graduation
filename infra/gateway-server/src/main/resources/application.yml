spring:
  application:
    name: gateway-server
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true
  config:
    import: 'configserver:'

management:
  endpoint:
    gateway:
      enabled: true
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}